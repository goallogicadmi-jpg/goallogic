<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligas de Fútbol - Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1419;
            color: white;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Menú horizontal estilo 365Scores */
        .leagues-menu {
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            padding: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }

        .leagues-menu::-webkit-scrollbar {
            height: 6px;
        }

        .leagues-menu::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .leagues-menu::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .leagues-container {
            display: flex;
            padding: 0 20px;
            min-width: max-content;
        }

        .league-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            min-width: 120px;
            text-decoration: none;
        }

        .league-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .league-btn.active {
            color: #4fc3f7;
            border-bottom-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
        }

        .league-logo {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            border-radius: 50%;
            object-fit: cover;
        }

        .league-name {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
        }

        .league-country {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* Contenido principal */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .league-data {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .league-data.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .standings-table th,
        .standings-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .standings-table th {
            background: rgba(79, 195, 247, 0.2);
            font-weight: 600;
            color: #4fc3f7;
        }

        .standings-table tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: cover;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
        }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #4fc3f7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 8px;
            padding: 20px;
        }

        .date-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a1a;
        }

        .date-bar::-webkit-scrollbar {
            height: 6px;
        }

        .date-bar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .date-bar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .date-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            border-radius: 8px;
            min-width: 80px;
            white-space: nowrap;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .date-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .date-item.active {
            color: #4fc3f7;
            border-bottom-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
        }

        #matches-container {
            background: #0f1419;
            padding: 0;
            min-height: auto;
        }
           
        

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin: 20px 0;
        }

        .welcome-message h2 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .welcome-message p {
            opacity: 0.8;
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .league-btn {
                min-width: 100px;
                padding: 12px 15px;
            }
            
            .league-logo {
                width: 28px;
                height: 28px;
            }
            
            .league-name {
                font-size: 0.8rem;
            }
            
            .standings-table {
                font-size: 0.9rem;
            }
            
            .standings-table th,
            .standings-table td {
                padding: 8px 10px;
            }
        }

        /* Botón flotante moderno */
        .floating-nav-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .floating-nav-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.6);
            background: linear-gradient(135deg, #ee5a6f 0%, #ff6b6b 100%);
        }

        .floating-nav-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        @media (max-width: 768px) {
            .floating-nav-btn {
                top: 15px;
                right: 15px;
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Botón flotante de navegación -->
    <a href="/" class="floating-nav-btn">
        📊 Análisis de Fútbol
    </a>

    <div class="header">
        <h1>⚽ Ligas de Fútbol</h1>
        <p>Explora las mejores ligas del mundo</p>
    </div>



    <!-- Menú horizontal estilo 365Scores -->
    <div class="leagues-menu">
        <div class="leagues-container" id="leaguesContainer">
            <!-- Las ligas se cargarán aquí -->
        </div>
    </div>

    <div id="date-bar" class="date-bar"></div>
    <div id="matches-container"></div>

    <div class="main-content">
        <div class="welcome-message" id="welcomeMessage">
            <h2>🏆 Bienvenido al Centro de Ligas</h2>
            <p>Selecciona una liga del menú superior para ver las tablas de posiciones actualizadas</p>
        </div>

        <div id="leagueData" class="league-data">
            <div id="leagueContent"></div>
        </div>
    </div>



    <script>
    let currentLeague = null;
    let allLeagues = [];

    // Función para cargar las ligas desde la API
    async function loadLeaguesFromAPI() {
        try {
            const response = await fetch('/api/leagues');
            const data = await response.json();
            
            if (data.response && data.response.length > 0) {
                // Filtrar solo las ligas más importantes
                // Agregadas: Saudi Pro League (307), Categoría Primera A Colombia (235)
                const importantLeagueIds = [39, 140, 78, 135, 61, 2, 3, 71, 88, 94, 103, 113, 144, 203, 262, 307, 235];
                
                allLeagues = data.response
                    .filter(item => importantLeagueIds.includes(item.league.id))
                    .map(item => ({
                        id: item.league.id,
                        name: item.league.name,
                        logo: item.league.logo,
                        country: item.country.name,
                        flag: item.country.flag
                    }));

                displayLeaguesMenu();
            } else {
                loadFallbackLeagues();
            }
        } catch (error) {
            console.error('Error cargando ligas:', error);
            loadFallbackLeagues();
        }
    }

    // Ligas de respaldo si la API falla
    function loadFallbackLeagues() {
        allLeagues = [
            { id: 39, name: "Premier League", country: "England", logo: "https://media.api-sports.io/football/leagues/39.png" },
            { id: 140, name: "La Liga", country: "Spain", logo: "https://media.api-sports.io/football/leagues/140.png" },
            { id: 78, name: "Bundesliga", country: "Germany", logo: "https://media.api-sports.io/football/leagues/78.png" },
            { id: 135, name: "Serie A", country: "Italy", logo: "https://media.api-sports.io/football/leagues/135.png" },
            { id: 61, name: "Ligue 1", country: "France", logo: "https://media.api-sports.io/football/leagues/61.png" },
            { id: 2, name: "Champions League", country: "World", logo: "https://media.api-sports.io/football/leagues/2.png" }
        ];
        displayLeaguesMenu();
    }

    // Mostrar el menú de ligas
    function displayLeaguesMenu() {
        const container = document.getElementById('leaguesContainer');
        container.innerHTML = '';

        allLeagues.forEach(league => {
            const btn = document.createElement('button');
            btn.className = 'league-btn';
            btn.onclick = () => selectLeague(league.id, league.name, btn);
            
            btn.innerHTML = `
                <img src="${league.logo}" alt="${league.name}" class="league-logo"
                     onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTYiIGZpbGw9IiM0ZmMzZjciLz4KPHN2ZyB4PSI4IiB5PSI4IiB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPgo8cGF0aCBkPSJNMTIgMkM2LjQ4IDIgMiA2LjQ4IDIgMTJzNC40OCAxMCAxMCAxMCAxMC00LjQ4IDEwLTEwUzE3LjUyIDIgMTIgMnptLTIgMTVsLTUtNSAxLjQxLTEuNDFMMTAgMTQuMTdsNy41OS03LjU5TDE5IDhsLTkgOXoiLz4KPC9zdmc+Cjwvc3ZnPgo='">
                <div class="league-name">${league.name}</div>
                <div class="league-country">${league.country}</div>
            `;
            
            container.appendChild(btn);
        });
    }

    // Seleccionar una liga
    function selectLeague(leagueId, leagueName, btnElement) {
        document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        currentLeague = leagueId;

        document.getElementById('welcomeMessage').style.display = 'none';
        document.getElementById('leagueData').classList.add('active');

        const content = document.getElementById('leagueContent');
        const realSeason = getCurrentSeason();

        content.innerHTML = `
            <h2>📊 ${leagueName} - Temporada ${realSeason}</h2>
            <div class="loading">
                <div class="loading-spinner"></div>
                Cargando tabla de posiciones...
            </div>
        `;

        fetch(`/api/league/${leagueId}?season=${realSeason}`)
            .then(response => response.json())
            .then(data => {
                if (data.response && data.response.length > 0 && data.response[0].league.standings) {
                  displayStandings(data.response[0].league.standings[0], leagueName, data.seasonUsed);
                } else {
                    content.innerHTML = `
                        <h2>📊 ${leagueName} - Temporada ${realSeason}</h2>
                        <div class="error">
                            <h3>⚠️ Datos no disponibles</h3>
                            <p>No se pudieron cargar los datos de esta liga para la temporada ${realSeason}.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                content.innerHTML = `
                    <h2>📊 ${leagueName} - Temporada ${realSeason}</h2>
                    <div class="error">
                        <h3>❌ Error de conexión</h3>
                        <p>No se pudo conectar con el servidor. Verifica tu conexión.</p>
                    </div>
                `;
            });
    }

    // Obtener temporada actual
function getCurrentSeason() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    return month >= 8 ? year : year - 1;
}

    // Mostrar tabla de posiciones
    function displayStandings(standings, leagueName, season) {
        const content = document.getElementById('leagueContent');
        
        let tableHTML = `
            <h2>📊 ${leagueName} - Temporada ${season}</h2>
            <div style="margin-bottom: 20px; padding: 15px; background: rgba(79, 195, 247, 0.1); border-radius: 8px; border-left: 4px solid #4fc3f7;">
                <p><strong>Temporada:</strong> ${season}/${parseInt(season) + 1}</p>
                <p><strong>Última actualización:</strong> ${new Date().toLocaleDateString('es-ES')}</p>
            </div>
            <table class="standings-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Equipo</th>
                        <th>PJ</th>
                        <th>G</th>
                        <th>E</th>
                        <th>P</th>
                        <th>GF</th>
                        <th>GC</th>
                        <th>DG</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody>
        `;

        standings.forEach(team => {
            const rankClass =
                team.rank <= 4 ? 'champions' :
                team.rank <= 6 ? 'europa' :
                team.rank >= standings.length - 2 ? 'relegation' : '';

            tableHTML += `
                <tr class="${rankClass}">
                    <td><strong>${team.rank}</strong></td>
                    <td>
                        <div class="team-info">
                            <img src="${team.team.logo}" alt="${team.team.name}" class="team-logo"
                                 onerror="this.style.display='none'">
                            <span>${team.team.name}</span>
                        </div>
                    </td>
                    <td>${team.all.played}</td>
                    <td>${team.all.win}</td>
                    <td>${team.all.draw}</td>
                    <td>${team.all.lose}</td>
                    <td>${team.all.goals.for}</td>
                    <td>${team.all.goals.against}</td>
                    <td>${team.goalsDiff > 0 ? '+' : ''}${team.goalsDiff}</td>
                    <td><strong>${team.points}</strong></td>
                </tr>
            `;
        });

        tableHTML += `
                </tbody>
            </table>
            <div style="margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; font-size: 0.9rem; opacity: 0.8;">
                <p><strong>Leyenda:</strong> PJ=Partidos Jugados, G=Ganados, E=Empates, P=Perdidos, GF=Goles a Favor, GC=Goles en Contra, DG=Diferencia de Goles, Pts=Puntos</p>
            </div>
        `;

        content.innerHTML = tableHTML;
    }

    // Inicializar la aplicación
    document.addEventListener('DOMContentLoaded', () => {
        loadLeaguesFromAPI();
        generateDateBar();
    });

    // Funciones para la barra de fechas
    function generateDateBar() {
        const dateBar = document.getElementById("date-bar");
        const today = new Date();
        
        for (let i = -4; i <= 5; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);
            const formatted = d.toISOString().split("T")[0];
            
            const div = document.createElement("div");
            div.classList.add("date-item");
            div.dataset.date = formatted;
            div.textContent = d.toLocaleDateString("es-ES", {
                weekday: "short",
                day: "numeric",
                month: "short"
            });
            
            div.addEventListener("click", () => {
                document.querySelectorAll(".date-item").forEach(el => el.classList.remove("active"));
                div.classList.add("active");
                loadMatchesByDate(formatted);
            });
            
            dateBar.appendChild(div);
        }
    }

    async function loadMatchesByDate(date) {
        try {
            const res = await fetch(`/api/matches?date=${date}`);
            const data = await res.json();
            renderMatches(data.matches);
        } catch (err) {
            console.error("Error cargando partidos:", err);
        }
    }

    function renderMatches(matches) {
        const container = document.getElementById("matches-container");
        container.innerHTML = "";
        
        if (!matches || matches.length === 0) {
            container.innerHTML = `
                <div class="main-content">
                    <div style="text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.05); border-radius: 15px; margin: 20px 0;">
                        <p style="color: #ccc; font-size: 1.1rem;">No hay partidos para esta fecha.</p>
                    </div>
                </div>
            `;
            return;
        }
        
        let matchesHTML = `
            <div class="main-content">
                <div style="background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin: 20px 0;">
                    <h3 style="color: #4fc3f7; margin-bottom: 20px; text-align: center;">⚽ Partidos del día</h3>
                    <div class="matches-grid">
        `;
        
        matches.forEach(m => {
            matchesHTML += `
                <div style="background: rgba(255,255,255,0.05); margin: 10px 0; padding: 15px; border-radius: 8px; border-left: 3px solid #4fc3f7;">
                    <strong style="color: #4fc3f7;">${m.homeTeam} vs ${m.awayTeam}</strong><br>
                    <span style="color: #ccc;">Hora: ${m.time}</span>
                </div>
            `;
        });
        
        matchesHTML += `
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = matchesHTML;
    }
</script>
</body>
</html>
