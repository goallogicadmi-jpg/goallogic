# GOAL_LOGIC — Nginx frente a Node (PASO H: HTTPS, HSTS, ocultar versión)
# Ajusta rutas de certificados y upstream según tu VPS/hosting.
#
# Certificados Let's Encrypt (ejemplo Debian/Ubuntu):
#   ssl_certificate     /etc/letsencrypt/live/goal-logic.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/goal-logic.com/privkey.pem;

server_tokens off;

upstream goal_logic_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS (301 a canonical https://goal-logic.com)
server {
    listen 80;
    listen [::]:80;
    server_name goal-logic.com www.goal-logic.com;
    return 301 https://goal-logic.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goal-logic.com www.goal-logic.com;

    # ssl_certificate     /etc/letsencrypt/live/goal-logic.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/goal-logic.com/privkey.pem;

    # HSTS: activar solo cuando HTTPS y certificado estén correctos en producción
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    keepalive_timeout 65;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://goal_logic_node;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # brotli on;  (requiere ngx_brotli)
}
